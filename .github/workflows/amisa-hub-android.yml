name: AmisA Hub Android AAB
on:
  workflow_dispatch:
  push:
    branches: [feature/amisa-hub-android-release]
    paths: ['android-hub/**', '.github/workflows/amisa-hub-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: android-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release bundle
        run: |
          set -o pipefail
          gradle :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee android-build.log
      - name: Report failed build log in GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'android-hub/android-build.log';
            const log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-18000) : 'Build log unavailable; failure occurred before Gradle step.';
            const body = 'Automatic diagnostic from run ' + context.runId + '\\n\\n' + '\`\`\`text\\n' + log.replaceAll('\\`\\`\\`', '---') + '\\n\`\`\`';
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:'AmisA Android build failure - run '+context.runId,body,labels:[]});
      - name: Upload AAB artifact (unsigned unless signing secrets configured)
        uses: actions/upload-artifact@v4
        with:
          name: amisa-hub-android-aab
          path: android-hub/app/build/outputs/bundle/release/*.aab
          retention-days: 7
