name: AmisA Hub Android AAB
on:
  workflow_dispatch:
  push:
    branches: [feature/amisa-hub-android-release]
    paths: ['android-hub/**', '.github/workflows/amisa-hub-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure secure upload signing
        env:
          KEYSTORE_B64: ${{ secrets.AMISA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AMISA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMISA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMISA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android upload signing secrets are missing. Do not publish an unsigned bundle."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/amisa-upload.jks"
          chmod 600 "$RUNNER_TEMP/amisa-upload.jks"
          echo "AMISA_KEYSTORE_PATH=$RUNNER_TEMP/amisa-upload.jks" >> "$GITHUB_ENV"
          echo "AMISA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AMISA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AMISA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release bundle
        run: |
          set -o pipefail
          gradle :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee android-build.log
      - name: Verify signed Android bundle
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          # jarsigner -strict treats certificate warnings as failures even when the signature is valid.
          # Keep the actual signature verification mandatory; do not bypass an invalid signature.
          verification_output="$(jarsigner -verify "$AAB" 2>&1)" || {
            echo "::error::AAB cryptographic signature verification failed."
            exit 1
          }
          if ! printf '%s\\n' "$verification_output" | grep -Fq "jar verified."; then
            echo "::error::AAB signature was not confirmed by jarsigner."
            exit 1
          fi
          echo "AAB cryptographic signature verification passed (certificate warnings may still require review)."
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/amisa-upload.jks"
      - name: Upload verified signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: amisa-hub-android-aab
          path: android-hub/app/build/outputs/bundle/release/*.aab
          retention-days: 7
