plugins { id 'com.android.application' }

android {
    namespace 'com.amisabc.amisahub'
    compileSdk 36
    defaultConfig {
        applicationId 'com.amisabc.amisahub'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('AMISA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('AMISA_KEYSTORE_PATH'))
                storePassword System.getenv('AMISA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMISA_KEY_ALIAS')
                keyPassword System.getenv('AMISA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('AMISA_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}
